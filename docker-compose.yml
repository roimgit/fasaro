services:
  postgres:
    image: postgres:16-alpine
    container_name: fasaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wedding_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedding_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fasaro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fasaro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    container_name: fasaro-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword; do
        echo 'MinIO is not ready yet, retrying in 2 seconds...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/wedding-assets;
      /usr/bin/mc anonymous set download myminio/wedding-assets;
      echo 'Bucket wedding-assets created with public-read policy successfully.';
      exit 0;
      "

volumes:
  postgres_data:
    name: fasaro_postgres_data
  redis_data:
    name: fasaro_redis_data
  minio_data:
    name: fasaro_minio_data
